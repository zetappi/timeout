<!-- IF S_USER_IN_TIMEOUT -->
{TIMEOUT_WARNING_HTML}

<div id="marcozp_timeout_countdown_overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; color: #fff; z-index: 999999; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box;">
	<div style="font-size: 1.8em; font-weight: bold; max-width: 700px; line-height: 1.4;" id="marcozp_timeout_countdown_message">{L_TIMEOUT_COUNTDOWN_MESSAGE}</div>
	<div style="font-size: 6em; font-weight: bold; margin-top: 20px;" id="marcozp_timeout_countdown_number">{TIMEOUT_COUNTDOWN_SECONDS}</div>
</div>

<script>
(function() {
	var seconds = {TIMEOUT_COUNTDOWN_SECONDS};
	var overlay = document.getElementById('marcozp_timeout_countdown_overlay');
	var numberEl = document.getElementById('marcozp_timeout_countdown_number');

	numberEl.textContent = seconds;

	var timer = setInterval(function() {
		seconds--;
		if (seconds <= 0)
		{
			clearInterval(timer);
			overlay.style.display = 'none';
			return;
		}
		numberEl.textContent = seconds;
	}, 1000);
})();
</script>
<!-- ENDIF -->
