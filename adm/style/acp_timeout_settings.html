<!-- INCLUDE overall_header.html -->

<h1>{L_ACP_TIMEOUT_SETTINGS}</h1>

<form id="acp_timeout_settings" method="post" action="{U_ACTION}">
    <fieldset>
        <legend>{L_ACP_TIMEOUT_GENERAL_SETTINGS}</legend>
        <dl>
            <dt><label for="timeout_enable">{L_TIMEOUT_ENABLE}{L_COLON}</label><br /><span>{L_TIMEOUT_ENABLE_EXPLAIN}</span></dt>
            <dd><label><input type="radio" class="radio" name="timeout_enable" value="1" <!-- IF TIMEOUT_ENABLE -->checked="checked"<!-- ENDIF -->/> {L_YES}</label>
                <label><input type="radio" class="radio" name="timeout_enable" value="0" <!-- IF not TIMEOUT_ENABLE -->checked="checked"<!-- ENDIF --> /> {L_NO}</label></dd>
        </dl>
        <dl>
            <dt><label for="timeout_notify_user">{L_TIMEOUT_NOTIFY_USER}{L_COLON}</label><br /><span>{L_TIMEOUT_NOTIFY_USER_EXPLAIN}</span></dt>
            <dd><label><input type="radio" class="radio" name="timeout_notify_user" value="1" <!-- IF TIMEOUT_NOTIFY_USER -->checked="checked"<!-- ENDIF -->/> {L_YES}</label>
                <label><input type="radio" class="radio" name="timeout_notify_user" value="0" <!-- IF not TIMEOUT_NOTIFY_USER -->checked="checked"<!-- ENDIF --> /> {L_NO}</label></dd>
        </dl>
        <dl>
            <dt><label for="timeout_max_duration">{L_TIMEOUT_MAX_DURATION}{L_COLON}</label><br /><span>{L_TIMEOUT_MAX_DURATION_EXPLAIN}</span></dt>
            <dd><input type="number" min="1" max="10080" name="timeout_max_duration" id="timeout_max_duration" value="{TIMEOUT_MAX_DURATION}" /> {L_MINUTES}</dd>
        </dl>
        <dl>
            <dt><label for="timeout_log">{L_TIMEOUT_LOG}{L_COLON}</label><br /><span>{L_TIMEOUT_LOG_EXPLAIN}</span></dt>
            <dd><label><input type="radio" class="radio" name="timeout_log" value="1" <!-- IF TIMEOUT_LOG -->checked="checked"<!-- ENDIF -->/> {L_YES}</label>
                <label><input type="radio" class="radio" name="timeout_log" value="0" <!-- IF not TIMEOUT_LOG -->checked="checked"<!-- ENDIF --> /> {L_NO}</label></dd>
        </dl>
    </fieldset>

    <fieldset class="submit-buttons">
        <input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}" />&nbsp;
        <input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}" />
        {S_FORM_TOKEN}
    </fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
